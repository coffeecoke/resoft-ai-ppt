[scraper]
; 中国采招网登录账号（必填，否则无法爬取）
username = 
password = 

; 关键词列表，英文逗号隔开；也可在 Web 端或接口传入，此处为默认值
keywords = 招标公告

; 每个关键词最多爬几页搜索结果
max_pages = 1

; 是否无头模式（true=不弹浏览器窗口）
headless = false

; 输出目录（由 ai_backend 调用时会通过环境变量覆盖）
output_dir = output

; 保存格式：txt=仅文本, html=仅HTML, both=同时保存
output_format = both

; 每步操作间隔毫秒（越大越慢越安全）
slow_mo = 400

; 时间筛选范围（格式 YYYY-MM-DD），留空则不筛选
start_date = 
end_date = 

[wecom]
enabled = false
webhook_url = 
corp_id = 
agent_id = 
secret = 
to_user = 
to_chatid = 
