<!-- 简历查询管理：按「源文件 + 单人」列表，详情为源文档式表格 + 证明材料 -->
<div class="page-header rq-page-header">
  <div class="rq-page-header__top">
    <h1>👤 简历查询管理</h1>
    <p class="page-description rq-page-desc">列表展示每条入库的<strong>单人简历</strong>（源响应文件、姓名、角色等）；详情为与 Word 类似的<strong>表格式简历</strong>，并展示学历/工作等证明图片，支持下载。</p>
  </div>
  <div class="rq-toolbar" role="search">
    <input type="text" id="rq-filter-basename" class="rq-input" placeholder="项目文件夹 / 源文件名（模糊）">
    <input type="text" id="rq-filter-person" class="rq-input rq-input--sm" placeholder="姓名（模糊）">
    <input type="text" id="rq-filter-batch" class="rq-input rq-input--sm" placeholder="批次 run_batch_id">
    <div class="rq-toolbar__btns">
      <button type="button" class="btn btn-primary" onclick="rqLoadList(1)"><span class="icon">🔍</span> 查询</button>
      <button type="button" class="btn btn-secondary" onclick="rqResetFilters()"><span class="icon">↺</span> 重置</button>
    </div>
  </div>
</div>

<div style="margin:16px 0;">
  <div id="rq-summary" style="font-size:13px;color:var(--text-secondary);"></div>
  <div style="overflow-x:auto;margin-top:12px;">
    <table class="rq-table" style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead>
        <tr style="background:var(--bg-secondary,#f0f0f0);text-align:left;">
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);">项目文件夹</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);width:100px;">姓名</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);width:120px;">角色</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);">章节</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);width:130px;">批次</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);width:150px;">入库时间</th>
          <th style="padding:10px;border:1px solid var(--border-color,#ddd);width:100px;">操作</th>
        </tr>
      </thead>
      <tbody id="rq-tbody"></tbody>
    </table>
  </div>
  <div id="rq-pager" style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;"></div>
</div>

<dialog id="rq-detail-dialog" style="max-width:820px;width:96%;max-height:94vh;">
  <div class="dialog-content" style="display:flex;flex-direction:column;max-height:90vh;">
    <div class="dialog-header">
      <h2 id="rq-detail-title">简历详情</h2>
      <button class="icon-btn" onclick="rqCloseDetail()">✕</button>
    </div>
    <div class="dialog-body" style="flex:1;overflow:auto;padding:12px 16px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <button class="btn btn-primary btn-sm" type="button" id="rq-btn-split" style="display:none;">下载本段切片 DOCX</button>
        <button class="btn btn-secondary btn-sm" type="button" id="rq-btn-zip-record" style="display:none;">本章节材料 ZIP</button>
        <button class="btn btn-secondary btn-sm" type="button" id="rq-btn-zip-person">本人员材料 ZIP</button>
      </div>
      <div id="rq-doc-root"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="rqCloseDetail()">关闭</button>
    </div>
  </div>
</dialog>

<style>
  /* 覆盖全局 .page-header 单行 flex，避免标题、说明、筛选挤在一行 */
  .rq-page-header.page-header {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
  }
  .rq-page-header__top h1 {
    margin-bottom: 6px;
  }
  .rq-page-desc {
    margin: 0;
    max-width: 920px;
    line-height: 1.55;
    font-size: 14px;
    color: var(--text-secondary, #666);
  }
  .rq-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    padding: 12px 14px;
    background: var(--bg-secondary, #f7f8fa);
    border: 1px solid var(--border-color, #e5e5e5);
    border-radius: 8px;
  }
  .rq-toolbar .rq-input {
    padding: 8px 12px;
    border: 1px solid var(--border-color, #ddd);
    border-radius: 6px;
    min-width: 200px;
    flex: 1 1 200px;
    max-width: 320px;
    font-size: 14px;
  }
  .rq-toolbar .rq-input--sm {
    min-width: 120px;
    flex: 0 1 160px;
    max-width: 200px;
  }
  .rq-toolbar__btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .rq-table th:nth-child(4),
  .rq-table td:nth-child(4) {
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rq-doc-wrap { font-family: "Microsoft YaHei", SimSun, serif; color: #111; }
  .rq-doc-h1 { font-size: 15px; font-weight: 700; margin: 0 0 10px; text-align: left; }
  .rq-doc-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; margin-bottom: 16px; }
  .rq-doc-table td, .rq-doc-table th { border: 1px solid #333; padding: 8px 10px; vertical-align: top; word-break: break-word; }
  .rq-doc-label { background: #f3f3f3; font-weight: 600; width: 14%; }
  .rq-proof-title { font-size: 14px; font-weight: 700; margin: 16px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .rq-proof-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .rq-proof-item { text-align: center; font-size: 11px; }
  .rq-proof-item img { max-width: 160px; max-height: 120px; border: 1px solid #999; object-fit: contain; background: #fafafa; display: block; margin: 4px auto 0; }
</style>
