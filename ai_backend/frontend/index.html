<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档文本提取器 - Web版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="5" y="5" width="30" height="30" rx="5" fill="#4F46E5"/>
                    <text x="20" y="27" font-size="20" fill="white" text-anchor="middle" font-weight="bold">文</text>
                </svg>
                <h1>文档文本提取器</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="documents.html" style="color: #4F46E5; text-decoration: none; font-weight: 500;">📋 文档管理</a>
                <a href="analysis.html" style="color: #4F46E5; text-decoration: none; font-weight: 500;">🤖 AI分析</a>
                <div class="version">v1.0.0</div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 上传区域 -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h2>拖拽文件到这里</h2>
                    <p>或者</p>
                    <button class="btn btn-primary" id="selectBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                        选择 JSON 文件
                    </button>
                    <input type="file" id="fileInput" accept=".json" multiple hidden>
                    <p class="file-hint">支持单个或多个 JSON 文件（document_*.json）</p>
                </div>
            </section>

            <!-- 文件列表 -->
            <section class="file-list-section" id="fileListSection" style="display: none;">
                <div class="section-header">
                    <h3>待处理文件 (<span id="fileCount">0</span>)</h3>
                    <button class="btn btn-text" id="clearBtn">清空列表</button>
                </div>
                <div class="file-list" id="fileList"></div>
                <div class="action-bar">
                    <button class="btn btn-success" id="extractBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        开始提取
                    </button>
                </div>
            </section>

            <!-- 提取进度 -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="section-header">
                    <h3>提取进度</h3>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
                <div class="progress-details" id="progressDetails"></div>
            </section>

            <!-- 提取结果 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <div class="section-header">
                    <h3>提取结果</h3>
                    <button class="btn btn-text" id="downloadAllBtn">下载全部</button>
                </div>
                <div class="result-list" id="resultList"></div>
            </section>
        </main>

        <!-- 历史记录 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>提取历史</h3>
                <button class="btn btn-text" id="refreshHistoryBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2v20M2 12h20"></path>
                    </svg>
                    <p>暂无历史记录</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 预览模态框 -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="previewTitle">文件预览</h3>
                <button class="icon-btn modal-close" id="closePreviewBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="preview-toolbar">
                    <div class="preview-info">
                        <span id="previewLineCount">加载中...</span>
                    </div>
                    <div class="preview-actions">
                        <button class="btn btn-text" id="copyContentBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制内容
                        </button>
                        <button class="btn btn-text" id="downloadPreviewBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            下载文件
                        </button>
                    </div>
                </div>
                <div class="preview-content" id="previewContent">
                    <div class="loading">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                        </svg>
                        <p>正在加载...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
